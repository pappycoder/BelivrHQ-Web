name: BelivrHQ Web CI

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

# Direct Git deployments are disabled. Release requires every validation job to pass.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm run env:git:check
      - run: npm ci
      - run: npm run env:test
      - run: npm run release:test
      - run: npm run lint

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run security:test
      - run: npm run security:audit

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Sentry — source map upload + client DSN at build time. Secrets are
      # optional: the build stays green until they are configured in GitHub.
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    name: Web unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run audit:ui

  browser:
    name: Web browser security
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test test/browser/security-headers.e2e.ts test/browser/read-only-access.e2e.ts test/browser/offline-hidden.e2e.ts

  checks:
    name: Required web checks
    runs-on: ubuntu-latest
    needs: [lint, audit, typecheck, build, test, browser]
    if: always()
    steps:
      - name: Refuse failed, skipped or cancelled validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'if (Object.values(JSON.parse(process.env.RESULTS)).some(job => job.result !== "success")) process.exit(1)'

  pull-requests:
    name: Open checked pull requests
    runs-on: ubuntu-latest
    needs: checks
    if: vars.AUTOMATIC_RELEASE_PRS == 'true' && github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging'
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: web-pull-requests-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Create or reuse main and staging PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-pull-requests.cjs

  prepare:
    name: Prepare checked web
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [primary]
    environment:
      name: ${{ matrix.profile == 'legacy' && (github.ref_name == 'main' && 'legacy-production' || 'legacy-staging') || (github.ref_name == 'main' && 'production' || 'staging') }}
    concurrency:
      group: web-release-${{ matrix.profile }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PROFILE: ${{ matrix.profile }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      WEB_RELEASE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install pinned deployment CLI
        run: npm install --global vercel@65.9.0
      - name: Validate target and checked branch head
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-web.cjs preflight
      - name: Deploy candidate and verify readiness
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-web.cjs prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-candidate-${{ matrix.profile }}
          path: .ops/release-candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote checked web
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [primary]
    environment:
      name: ${{ matrix.profile == 'legacy' && (github.ref_name == 'main' && 'legacy-production' || 'legacy-staging') || (github.ref_name == 'main' && 'production' || 'staging') }}
    concurrency:
      group: web-promotion-${{ matrix.profile }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      RELEASE_PROFILE: ${{ matrix.profile }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      WEB_RELEASE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-candidate-${{ matrix.profile }}
          path: .ops
      - run: npm install --global vercel@65.9.0
      - name: Revalidate checked candidate and promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-web.cjs promote
